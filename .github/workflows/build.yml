name: Validate and build desktop packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build and test macOS
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run web:build
      - name: Test web at root and under /desk
        shell: pwsh
        run: |
          $env:TRINITY_CHROMIUM = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          npm run test:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TRINITY_TEST_BASE_PATH = '/desk'
          npm run test:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:e2e
        timeout-minutes: 5
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: release/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: |
            test-results/*.png
            test-results/*report.json
  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
        timeout-minutes: 5
      - run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-package-unsigned
          path: |
            release/*.dmg
            release/*.zip
